      <img src="/assets/img/about/company-01.jpg" alt="VGate Company">

</div>

<!-- PHILOSOPHY & VISION -->
<div class="trackingWrap" data-aos="fade-up" data-aos-easing="ease-out-quart" data-aos-duration="800" data-aos-once="true">

  <div class="vg-split">
    <div class="vg-split-txt vg-body" id="philosophy-hk" style="width:100%;max-width:none"></div>
    <div class="vg-split-img" style="flex:0 0 58.66%">
      <img src="/assets/img/about/company-02.jpg" alt="Philosophy">
    </div>
  </div>
</div>

<!-- CORPORATE MILESTONES -->
<div class="trackingWrap" data-aos="fade-up" data-aos-easing="ease-out-quart" data-aos-duration="800" data-aos-once="true">

<!-- OUR FOOTPRINTS IN ASIA -->

    <div class="vg-footprint-img">
      <img src="/assets/img/about/asia-footprint.jpg" alt="Asia Footprint">
    </div>
    <p class="vg-body" id="footprint-hk" style="margin-top:20px"></p>
    <ul class="vg-cities" id="cities-hk"></ul>
  </div>

<!-- STATS BAND -->
<div class="trackingWrap" data-aos="fade-up" data-aos-easing="ease-out-quart" data-aos-duration="800" data-aos-once="true">
  <div class="vg-stats" id="stats-hk"></div>

  <a href="/about/business/">探索我們的業務 <span class="arrow">→</span></a>

<script>window.addEventListener('DOMContentLoaded',function(){AOS.init();});</script>
<script src="/assets/js/vgate-data.js?v=2026093019"></script>
<script src="/assets/js/common.js?v=2026093019"></script>
<script>
window.addEventListener("DOMContentLoaded",function(){
  header(); footer();
  var L='hk';
  var ov=window.VGATE.about.overview[L]||[];
  document.getElementById('overview-hk').innerHTML=ov.map(function(p){return'<p>'+p+'</p>';}).join('');
  var ph=window.VGATE.about.philosophy[L]||[];
  document.getElementById('philosophy-hk').innerHTML=ph.map(function(p){return'<p>'+p+'</p>';}).join('');
  var ms=window.VGATE.milestones.slice().reverse();
  document.getElementById('timeline-hk').innerHTML=ms.map(function(m){
    return'<div class="vg-tl-item"><span class="vg-tl-year">'+m.year+'</span><span class="vg-tl-text">'+window.VGATE.t(m,L)+'</span></div>';
  }).join('');
  document.getElementById('footprint-hk').innerHTML='<p>'+window.VGATE.t(window.VGATE.about.footprint,L)+'</p>';
  document.getElementById('cities-hk').innerHTML=window.VGATE.about.footprintCities.map(function(c){
    var isHQ=c.role&&c.role[L]&&(c.role[L].toLowerCase().indexOf('head')>-1||c.role[L].indexOf('總部')>-1||c.role[L].indexOf('总部')>-1||c.role[L].indexOf('本社')>-1);
    return'<li>'+window.VGATE.t(c.city,L)+(isHQ?' <span class="hq">HQ</span>':'')+'</li>';
  }).join('');
  document.getElementById('stats-hk').innerHTML=window.VGATE.about.stats.map(function(s){
    return'<div><div class="n">'+s.value+'</div><div class="l">'+window.VGATE.t(s.label,L)+'</div></div>';
  }).join('');
});
</script>
</body>
</html>
