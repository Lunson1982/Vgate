<script>
window.addEventListener("DOMContentLoaded",function(){
  header(); footer();
  renderAbout();
});
function renderAbout(){
  // lang.js maps URL prefix/en/cn/hk -> en/zh-CN/zh-HK; the VGATE data keys are en/jp/cn/hk.
  var lang=document.documentElement.lang||'ja';
  var L={ja:'jp',en:'en','zh-CN':'cn','zh-HK':'hk'}[lang]||'jp';
  var V=window.VGATE; if(!V||!V.about) return;
  var t=V.t||function(x,k){return typeof x==='string'?x:(x&&x[k])||'';};
  // Overview
  document.getElementById('about-overview').innerHTML=
    (V.about.overview[L]||V.about.overview.jp||[]).map(function(p){return '<p>'+p+'</p>';}).join('');
  // Philosophy
  document.getElementById('about-philosophy').innerHTML=
    (V.about.philosophy[L]||V.about.philosophy.jp||[]).map(function(p){return '<p>'+p+'</p>';}).join('');
  // Timeline (newest first)
  document.getElementById('about-timeline').innerHTML=V.milestones.slice().reverse().map(function(m){
    return '<div class="vg-tl-item"><span class="vg-tl-year">'+m.year+'</span><span class="vg-tl-text">'+t(m,L)+'</span></div>';
  }).join('');
  // Footprint
  document.getElementById('about-footprint').innerHTML='<p>'+t(V.about.footprint,L)+'</p>';
  // Cities
  document.getElementById('about-cities').innerHTML=V.about.footprintCities.map(function(c){
    var r=c.role&&t(c.role,L);
    var isHQ=r&&(r.toLowerCase().indexOf('head')>-1||r.indexOf('本社')>-1||r.indexOf('總部')>-1||r.indexOf('总部')>-1);
    return '<li>'+t(c.city,L)+(isHQ?' <span class="hq">HQ</span>':'')+'</li>';
  }).join('');
  // Stats
  document.getElementById('about-stats').innerHTML=V.about.stats.map(function(s){
    return '<div><div class="n">'+s.value+'</div><div class="l">'+t(s.label,L)+'</div></div>';
  }).join('');
}
// Re-render the about page whenever lang.js switches languages.
document.addEventListener('vgate:lang-changed',renderAbout);
</script>
