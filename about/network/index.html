<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/svg+xml" href="/assets/img/companies/group_logo.svg">
<title>店舗ネットワーク | Vgate</title>
<link rel="stylesheet" type="text/css" media="all" href="/assets/css/reset.css?v=2026093025">
<link rel="stylesheet" type="text/css" media="all" href="/assets/css/common.min.css?v=2026093025">
<link rel="stylesheet" type="text/css" media="all" href="/assets/css/stores2.min.css?v=2026093025">
<script type="text/javascript" src="/assets/js/aos.js?v=2026093025"></script>
<script type="text/javascript" src="/assets/js/include-parts.js?v=2026093025"></script>
<script type="text/javascript" src="/assets/js/lang.js?v=2026093025"></script>
<script type="text/javascript" src="/assets/js/vgate-data.js?v=2026093025"></script>
</head>
<body>
<div id="vgate-header"><script>header('../../');</script></div>

<div id="vg-stores">
<div class="contWrap">

<section class="trackingWrap inner txtWrap first" data-aos="fade-up" data-aos-easing="ease-out-quart" data-aos-duration="800" data-aos-once="true">
  <div class="jpnCont">
    <h2 class="vg-title">OUR STORES<span class="vg-title-sub">店舗ネットワーク</span></h2>
    <p class="vg-intro">VGateの全店舗は、各地の最繁華な商業地区に位置する一流ショッピングモール内有ります。</p>
  </div>
  <div class="engCont">
    <h2 class="vg-title">OUR STORES<span class="vg-title-sub">Our Stores</span></h2>
    <p class="vg-intro">All VGate stores are located inside premier shopping malls in the most central commercial districts of each region.</p>
  </div>
  <div class="chnCont">
    <h2 class="vg-title">门店网络<span class="vg-title-sub">OUR STORES</span></h2>
    <p class="vg-intro">VGate全门店均位于各地区最繁华商业区的一流购物中心内。</p>
  </div>
  <div class="hkCont">
    <h2 class="vg-title">店舖網絡<span class="vg-title-sub">OUR STORES</span></h2>
    <p class="vg-intro">VGate全分店均位於各地區最繁華商業區的一流購物中心內。</p>
  </div>
</section>

<div class="inner">
  <div class="vg-filter" id="brand-filter">
    <button class="is-on" data-brand="">ALL</button>
  </div>
  <div class="vg-chains" id="chain-list"></div>
  <div class="vg-shops" id="shop-list"></div>
</div>

</div><!-- /.contWrap -->
</div><!-- /#vg-stores -->

<div id="vgate-footer"><script>footer('../../');</script></div>
<div id="pagetop" aria-label="Back to top" role="button" tabindex="0">
  <p><svg class="arrow" viewBox="0 0 81 70.2" aria-hidden="true"><polygon points="57.7,1.8 75.9,33.3 0,33.3 0,36.9 39.5,36.9 75.9,36.9 57.7,68.4 60.8,70.2 81,35.1 60.8,0" /></svg></p>
  <svg class="roundBtnLine" aria-hidden="true"><rect rx="25"></rect></svg>
</div>
<script>
window.addEventListener('DOMContentLoaded', function () {
  AOS.init();

  var LANG = 'jp';
  var shops = window.VGATE.shops;
  var t = window.VGATE.t;
  var storeBrands = window.VGATE.storeBrands;

  var filterEl = document.getElementById('brand-filter');
  var allBtn = filterEl.querySelector('button[data-brand=""]');

  storeBrands.forEach(function (brand) {
    var btn = document.createElement('button');
    btn.dataset.brand = brand;
    btn.textContent = brand;
    filterEl.appendChild(btn);
  });

  filterEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.vg-filter button');
    if (!btn) return;
    var selected = btn.dataset.brand;
    filterEl.querySelectorAll('button').forEach(function (b) { b.classList.remove('is-on'); });
    btn.classList.add('is-on');
    applyFilter(selected);
  });

  function applyFilter(brand) {
    document.querySelectorAll('.vg-shop').forEach(function (card) {
      if (!brand) {
        card.classList.remove('is-filtered-out');
      } else {
        var brands = card.dataset.brands.split(',');
        card.classList.toggle('is-filtered-out', brands.indexOf(brand) === -1);
      }
    });
  }

  var chainMap = {};
  shops.forEach(function (shop) {
    var colonIdx = shop.shop.en.indexOf(':');
    var chain = colonIdx > -1 ? shop.shop.en.substring(0, colonIdx).trim() : shop.shop.en.trim();
    if (!chainMap[chain]) chainMap[chain] = [];
    chainMap[chain].push(shop);
  });

  var chainOrder = [
    'USAGI ONLINE STORE', 'NIJI SELECT', 'SNIDEL', 'Maison Cielune',
    'gelato pique', 'LILY BROWN', 'gelato pique cafe', 'Cosme Kitchen'
  ];

  var chainListEl = document.getElementById('chain-list');

  chainOrder.forEach(function (chain) {
    var shopsInChain = chainMap[chain];
    if (!shopsInChain || shopsInChain.length === 0) return;

    var chainDiv = document.createElement('div');
    chainDiv.className = 'vg-chain';

    var head = document.createElement('div');
    head.className = 'vg-chain-head';
    head.innerHTML = '<h3>' + chain + '</h3><span class="vg-chain-count">' + shopsInChain.length + ' SHOPS</span>';

    var locs = document.createElement('div');
    locs.className = 'vg-chain-locs';

    shopsInChain.forEach(function (shop) {
      var a = document.createElement('a');
      a.href = '#' + shop.anchor;
      a.dataset.target = shop.anchor;
      // Japanese variant: use English-language shop data per spec
      var district = t(shop.district, 'en');
      var mall = t(shop.mall, 'en');
      a.innerHTML = '<span class="vg-loc-district">' + district + '</span><span class="vg-loc-mall">' + mall + '</span>';
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        var target = document.getElementById(shop.anchor);
        if (!target) return;
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.remove('vg-shop--active');
        void target.offsetWidth;
        target.classList.add('vg-shop--active');
        clearTimeout(target._highlightTimer);
        target._highlightTimer = setTimeout(function () {
          target.classList.remove('vg-shop--active');
        }, 2000);
      });
      locs.appendChild(a);
    });

    chainDiv.appendChild(head);
    chainDiv.appendChild(locs);
    chainListEl.appendChild(chainDiv);
  });

  var shopListEl = document.getElementById('shop-list');

  shops.forEach(function (shop) {
    var card = document.createElement('article');
    card.className = 'vg-shop';
    card.id = shop.anchor;
    card.dataset.brands = shop.brands.join(',');

    var hasPhoto = shop.photo && shop.photo.trim() !== '';
    if (!hasPhoto) card.classList.add('vg-shop--no-photo');

    var photoHtml = '';
    if (hasPhoto) {
      // Japanese variant: English name per spec
      photoHtml = '<div class="vg-shop-photo"><img src="/assets/img/shops/' + shop.photo + '" alt="' + t(shop.shop, 'en') + '" loading="lazy"></div>';
    }

    var hoursRaw = t(shop.hours, 'en'); // English hours for Japanese variant
    var hoursHtml = hoursRaw ? '<p class="vg-shop-hours"><strong>BUSINESS HOURS</strong> ' + hoursRaw + '</p>' : '';

    var phoneDigits = shop.phone.replace(/\D/g, '');

    var brandsHtml = '<ul class="vg-shop-brands">' +
      shop.brands.map(function (b) { return '<li>' + b + '</li>'; }).join('') +
      '</ul>';

    // Japanese variant: English shop name and location
    card.innerHTML =
      photoHtml +
      '<div class="vg-shop-body">' +
        '<p class="vg-shop-no">NO. ' + String(shop.no).padStart(2, '0') + '</p>' +
        '<h3 class="vg-shop-name">' + t(shop.shop, 'en') + '</h3>' +
        '<p class="vg-shop-loc"><strong>LOCATION</strong> ' + t(shop.location, 'en') + '</p>' +
        '<p class="vg-shop-phone"><strong>PHONE</strong> <a href="tel:' + phoneDigits + '">' + shop.phone + '</a></p>' +
        hoursHtml +
        brandsHtml +
      '</div>';

    shopListEl.appendChild(card);
  });
});
</script>
<script src="/assets/js/common.js?v=2026093025"></script>
</body>
</html>
