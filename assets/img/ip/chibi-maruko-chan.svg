<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#ffe4e1"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#ff8aa8" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <!-- Maruko character placeholder: a simple stylized girl with bob haircut -->
  <g transform="translate(300,300)">
    <!-- head -->
    <ellipse cx="0" cy="-40" rx="120" ry="135" fill="#fff5e8" stroke="#1a1a1a" stroke-width="4"/>
    <!-- hair (bob) -->
    <path d="M -120,-50 Q -125,-180 -60,-200 Q 0,-220 60,-200 Q 125,-180 120,-50 Q 100,-130 0,-140 Q -100,-130 -120,-50 Z" fill="#3d2b1f" stroke="#1a1a1a" stroke-width="3"/>
    <!-- cheeks -->
    <ellipse cx="-60" cy="-30" rx="20" ry="12" fill="#ffb6c1" opacity="0.7"/>
    <ellipse cx="60" cy="-30" rx="20" ry="12" fill="#ffb6c1" opacity="0.7"/>
    <!-- eyes -->
    <ellipse cx="-35" cy="-50" rx="8" ry="12" fill="#1a1a1a"/>
    <ellipse cx="35" cy="-50" rx="8" ry="12" fill="#1a1a1a"/>
    <circle cx="-33" cy="-55" r="3" fill="#fff"/>
    <circle cx="37" cy="-55" r="3" fill="#fff"/>
    <!-- smile -->
    <path d="M -20,-10 Q 0,5 20,-10" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <!-- body -->
    <path d="M -90,110 Q -100,180 -85,250 L 85,250 Q 100,180 90,110 Q 60,95 0,95 Q -60,95 -90,110 Z" fill="#ff8aa8" stroke="#1a1a1a" stroke-width="3"/>
    <!-- collar -->
    <path d="M -40,95 L -50,115 L -25,120 M 40,95 L 50,115 L 25,120" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  </g>
  <!-- title -->
  <text x="300" y="525" text-anchor="middle" font-family="Comic Sans MS, sans-serif" font-size="34" font-weight="700" fill="#1a1a1a">ちびまる子ちゃん</text>
  <text x="300" y="565" text-anchor="middle" font-family="sans-serif" font-size="14" letter-spacing="3" fill="#666">CHIBI MARUKO-CHAN</text>
</svg>